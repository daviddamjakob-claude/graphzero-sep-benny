<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="graphzero">
  <!-- The wordmark's first two characters, set as outlines rather than as
       <text>: a favicon is fetched on its own, so a webfont the page loads is
       not available to it and a font-family here would fall back to whatever
       the machine has. These are Geist Medium's own glyphs, traced from the
       same subset the page loads, positioned by the font's advance widths so
       the pair sets exactly as the wordmark does.

       The plate is white and opaque, so the mark carries its own ground and no
       longer has to answer the tab's colour — hence the fixed black g, with no
       prefers-color-scheme flip: against this plate, a light-scheme flip would
       paint white on white. -->
  <rect width="64" height="64" fill="#ffffff"/>
  <g transform="translate(0.830 49.242) scale(0.05865 -0.05865)">
    <path d="M37 -110 333 750H435L140 -110Z" fill="#0000ff"/>
