<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GraphZero SEP</title>
<meta name="robots" content="noindex">
<style>
  :root {
    --bg: #ffffff;
    --fg: #16181d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --accent: #2f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #e8eaed;
      --muted: #9aa1ac;
      --line: #262a33;
      --accent: #6ea0ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }
  main { max-width: 34rem; width: 100%; }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    letter-spacing: -0.02em;
    margin: 0 0 0.5rem;
  }
  .tag {
    display: inline-block;
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 0.2rem 0.65rem;
    margin-bottom: 1.5rem;
  }
  p { color: var(--muted); margin: 0 0 1rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
  a { color: var(--accent); }
  footer { font-size: 0.85rem; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <span class="tag">Placeholder</span>
    <h1>GraphZero SEP</h1>
    <p>This site is not live yet. The repository is set up and GitHub Pages is serving this placeholder while the real content is written.</p>
    <hr>
    <footer>
      Source: <a href="https://github.com/daviddamjakob-claude/graphzero-sep">daviddamjakob-claude/graphzero-sep</a>
    </footer>
  </main>
</body>
</html>
